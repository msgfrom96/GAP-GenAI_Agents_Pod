name: CI/CD Pipeline

on:
  push:
    branches:
      - main  # Trigger on pushes to the main branch
  pull_request:
    branches:
      - main  # Trigger on pull requests to the main branch

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v3
        with:
          python-version: "3.9"  # Specify your Python version

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint with flake8
        run: |
          pip install flake8
          # You can configure flake8 with a .flake8 file in your repository
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Format with black
        run: |
          pip install black
          # You can configure black with a pyproject.toml file in your repository
          black . --line-length 127

      - name: Run pre-commit hooks
        run: pre-commit run --all-files

      - name: Test with pytest
        run: |
          pytest -v --cov --cov-report term-missing tests/  # Run tests and generate coverage report

      - name: Run Bandit security scan
        run: |
          pip install bandit
          bandit -r . -q -s B101,B301,B303,B401,B603,B607 --exit-code 1

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          token: ${{ secrets.CODECOV_TOKEN }} # Replace with your Codecov token

      - name: Generate documentation
        run: |
          pip install sphinx sphinx-rtd-theme sphinx-autodoc-typehints
          cd docs
          make html

      - name: Deploy documentation to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        if: github.ref == 'refs/heads/main'
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: docs/_build/html

  deploy:
    needs: build  # Ensure the build job completes successfully before deploying
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' # Only deploy on pushes to the main branch

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Deploy to staging environment
        id: deploy
        run: |
          # Add your deployment steps here
          echo "Deploying to staging environment..."
          # Example: Deploy to Heroku
          # heroku deploy:staging -a your-heroku-app
        continue-on-error: true # Allow the workflow to continue even if deployment fails

      - name: Rollback on failure
        if: steps.deploy.outcome == 'failure'
        run: |
          # Implement rollback logic here
          echo "Deployment failed. Rolling back to previous version..."
          # You'll need to determine the previous version and call the rollback script
          # Example:
          # python MaintainerAgent.py --rollback <previous_version> 